# 全量质量门（审计 2026-10-27 P2-5 / 2026-10-29 P1-4）：
# push/PR 上跑与本地 `npm run check` 同一组命令（tools/check-all.mjs 是唯一清单）。
#
# 关于宿主契约（唯一能发现「宿主把某个 --dsw-* 改名了」的那一层）：
#   CI 上没有本机的 app.asar —— 此前这一层永远是 SKIP，等于 0 条断言。
#   现在 `npm install` 会把宿主三件套的**公开 npm 包**装进 node_modules
#   （@deepseek-ai/dsh-client-ui-theme / dsh-client-ui-layout / dsh-web-frontend），
#   `check-host-contract.mjs` 从这些包里取证，断言数与真机一致；
#   末尾的 `npm run contract` 再以 `--strict` 兜一次：两个来源都拿不到就红，不许静默 SKIP。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 只为两件事装依赖：① 契约检查需要宿主 peer 包取证；② release.mjs 需要 semver
      - name: 安装依赖（含宿主 peer 包，供契约检查取证）
        run: npm install --no-audit --no-fund

      - name: 工具链回归（结构 / 自愈 / 审计回归 / 自定义 / 色彩数学 / README 短码 / 包内容 / 版本一致性）
        run: npm run check

      - name: 宿主契约硬门（拿不到 asar 或 peer 包时不许 SKIP）
        run: npm run contract

      - name: 对比度报表（标准档 + 高对比档，硬失败退出码 1）
        run: npm run report

      - name: 主题包导出（确认 npm run packs 也能在干净环境跑通）
        run: npm run packs
