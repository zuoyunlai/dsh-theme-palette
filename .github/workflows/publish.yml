# 发版（Trusted Publishing · OIDC）
#
# 为什么有这条 workflow（2026-10-29 的真实事故）：
#   npm 正在**收紧「绕过 2FA 的 token」用于直接发布的权限** —— registry 会打印
#   「npm tokens that bypass 2FA are being restricted for account changes and direct publishing」
#   （https://gh.io/npm-gat-bypass2fa-deprecation）。本机 ~/.npmrc 里那个能免 OTP 发布的
#   token 就是被这条政策逼到要一次性验证码的：发布要么给 OTP，要么改走 Trusted Publishing。
#   长期 token 迟早也会被同样收紧 —— 所以这条路要换成**没有任何长期凭据**的：
#
#   本 workflow 用 GitHub Actions 的 OIDC 身份向 npm 换取一次性发布凭据，
#   不需要 NODE_AUTH_TOKEN、不需要 2FA 验证码、也不怕 token 泄漏。
#
# 前提（**只有一次手工动作**，在 npmjs.com 上做）：
#   包 dsh-theme-palette → Settings → Trusted Publisher → 连 GitHub 仓库
#   zuoyunlai/dsh-theme-palette，Workflow 文件名填 `publish.yml`，Environment 留空。
#   连上之后，本 workflow 就能直接发版。
#
# 发版顺序（**别弄反**，反了会 E409）：
#   本地：门禁 → commit → 打 tag → 推 tag（`node tools/release.mjs --ci`）
#   CI  ：被 tag 触发 → 门禁 → npm publish（provenance）→ 等 registry → 建 GitHub Release
#   绝不要「本地先 publish 再推 tag」：版本号已占坑，CI 再 publish 会 E409。
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（v1.14.0 形式）'
        required: true

permissions:
  contents: write   # 建 GitHub Release（上传 npm 官方 tarball）
  id-token: write   # OIDC → npm Trusted Publishing（这是免 token 的关键）

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # 注意：**不要设 NODE_AUTH_TOKEN**。Trusted Publishing 走 OIDC，
          # 设了反而会让 npm 走 token 路径（并可能撞上「绕过 2FA 的 token 收紧」那条政策）。

      - name: 取版本号
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 门禁（六件套 + 两档 1080 组报表 + 包内容守卫）—— 不把红版本发出去
        run: |
          npm run check
          npm run report
          node tools/check-pack.mjs

      - name: 发布到 npm（Trusted Publishing：OIDC，无 token、无 OTP）
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PKG/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "registry 上已有 $VERSION —— 跳过 publish（幂等：重跑本 workflow 只会补 Release）"
            exit 0
          fi
          echo "::group::npm publish"
          # --provenance 需要 id-token: write（上面已授权）；--access public 是新包必填
          npm publish --provenance --access public
          echo "::endgroup::"

      - name: 等 registry 放出该版本（暂存审核期间会一直 404，最多 10 分钟）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PKG/$VERSION")
            if [ "$CODE" = "200" ]; then
              echo "registry 上已可下载 $VERSION"
              exit 0
            fi
            echo "第 $((i*15)) 秒：registry 还没放出 $VERSION（可能仍在审核）…"
            sleep 15
          done
          echo "::error::10 分钟内 registry 还没放出 $VERSION（仍在审核？稍后重跑本 workflow 会补 Release）"
          exit 1

      - name: 校验 tarball 完整性并建 GitHub Release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          TARBALL="$PKG-$VERSION.tgz"

          # 资产必须是 registry 上的**官方** tarball，且 sha1 与 registry 的 dist.shasum 逐字节一致
          # （仓库纪律：资产核 sha1==dist.shasum）。
          curl -sL -o "$TARBALL" "https://registry.npmjs.org/$PKG/-/$TARBALL"
          EXPECTED=$(curl -s "https://registry.npmjs.org/$PKG/$VERSION" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).dist.shasum)})")
          ACTUAL=$(sha1sum "$TARBALL" | cut -d' ' -f1)
          echo "registry dist.shasum: $EXPECTED"
          echo "本地 tarball sha1 : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::tarball 与 registry 不一致，拒绝发布 Release"
            exit 1
          fi

          # Release notes 取 CHANGELOG 里对应版本的那一节；取不到就退回一句最小说明（不因此中断发版）
          node tools/release-notes.mjs "$VERSION" > release-notes.md
          test -s release-notes.md || echo "## $VERSION" > release-notes.md

          # GitHub 的 latest 按**创建时间**判（不是语义版本）—— 显式 --latest 兜底，
          # 免得补建历史 Release 时把 latest 抢到旧版本上。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为补资产"
            gh release upload "$TAG" "$TARBALL" --clobber
            gh release edit "$TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "$TARBALL" --notes-file release-notes.md \
              --title "$TAG — dsh-theme-palette" --latest
          fi
          echo "Release 已就绪：$TAG"

      - name: 收尾核对
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const j=JSON.parse(s);
              const v=process.env.VERSION;
              console.log('registry 版本号 :', j.versions[v] ? j.versions[v].version : '（缺失！）');
              console.log('dist-tags.latest:', j['dist-tags'].latest);
              console.log('attestations    :', j.versions[v] && j.versions[v].dist.attestations ? '有（provenance 生效）' : '无');
            });
          " < <(curl -s "https://registry.npmjs.org/$PKG")
