# 发版（Trusted Publishing · OIDC）
#
# 为什么有这条 workflow（2026-10-29 的真实事故）：
#   npm 正在**收紧「绕过 2FA 的 token」用于直接发布的权限** —— registry 会打印
#   「npm tokens that bypass 2FA are being restricted for account changes and direct publishing」
#   （https://gh.io/npm-gat-bypass2fa-deprecation）。本机 ~/.npmrc 里那个能免 OTP 发布的
#   token 就是被这条政策逼到要一次性验证码的：发布要么给 OTP，要么改走 Trusted Publishing。
#   长期 token 迟早也会被同样收紧 —— 所以这条路要换成**没有任何长期凭据**的：
#
#   本 workflow 用 GitHub Actions 的 OIDC 身份向 npm 换取一次性发布凭据，
#   不需要 NODE_AUTH_TOKEN、不需要 2FA 验证码、也不怕 token 泄漏。
#
# 前提（**只有一次手工动作**，在 npmjs.com 上做）：
#   包 dsh-theme-palette → Settings → Trusted Publisher → 连 GitHub 仓库
#   zuoyunlai/dsh-theme-palette，Workflow 文件名填 `publish.yml`，Environment 留空。
#   ⚠️ 还要在 **Allowed actions** 里勾上「npm publish」—— 2026-09-03 之后创建的配置
#   默认只允许 `npm stage publish`（暂存），不勾这一项，本 workflow 的 `npm publish` 会被拒。
#   另外：trusted publishing 要求 **npm CLI ≥ 11.5.1**，所以本文件固定跑 node 24
#   （node 22 自带 npm 10.x，会静默退化成「无凭据发布」，症状只是一个含糊的 404）。
#   首次发布必须在配置后 2 天内完成，否则该配置会过期（npm 官方行为）。
#
# 发版顺序（**别弄反**，反了会 E409）：
#   本地：门禁 → commit → 打 tag → 推 tag（`node tools/release.mjs --ci`）
#   CI  ：被 tag 触发 → 门禁 → npm publish（provenance）→ 等 registry → 建 GitHub Release
#   绝不要「本地先 publish 再推 tag」：版本号已占坑，CI 再 publish 会 E409。
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（v1.14.0 形式）'
        required: true

permissions:
  contents: write   # 建 GitHub Release（上传 npm 官方 tarball）
  id-token: write   # OIDC → npm Trusted Publishing（这是免 token 的关键）

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 解析并验证目标 tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::非法发布 tag：$TAG"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # **必须是 node 24**：trusted publishing 要求 npm CLI ≥ 11.5.1，而 node 22 自带 npm 10.x ——
          # 用 22 会静默退化成「无凭据发布」，只拿到一个语焉不详的 404
          # （2026-10-29 实测：node 22 → E404 Not Found / PUT，排查了很久才发现是 npm 版本）。
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # 注意：**不要设 NODE_AUTH_TOKEN**。Trusted Publishing 走 OIDC，
          # 设了反而会让 npm 走 token 路径（并可能撞上「绕过 2FA 的 token 收紧」那条政策）。

      - name: 断言 npm CLI 支持 trusted publishing（< 11.5.1 直接红，别让它退化成无凭据发布）
        run: |
          set -euo pipefail
          echo "node $(node -v) / npm $(npm -v)"
          node -e "
            const [maj, min] = require('child_process').execSync('npm -v').toString().trim().split('.').map(Number);
            const ok = maj > 11 || (maj === 11 && min >= 5);
            if (!ok) { console.error('::error::npm CLI 版本过低（需要 ≥ 11.5.1 才支持 trusted publishing），当前 ' + maj + '.' + min); process.exit(1); }
            console.log('npm CLI 满足 trusted publishing 要求（≥ 11.5.1）');
          "

      - name: 确认检出的提交与 tag 指向一致
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::检出 SHA $HEAD_SHA 与 $TAG 指向的 $TAG_SHA 不一致"; exit 1
          fi
          PKG_V=$(node -p "require('./package.json').version")
          if [ "$PKG_V" != "$VERSION" ]; then
            echo "::error::tag $TAG 要求发布 $VERSION，但 package.json 是 $PKG_V"; exit 1
          fi
          echo "发布来源已绑定：$TAG / $HEAD_SHA / $PKG_V"

      - name: 断言 tag 与 package.json 版本一致（审计 2026-10-29 P1-2）
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # 发布的是 `npm publish` 读到的 package.json，不是 tag 推导出的 VERSION。
          # 两者不一致时：探针查的是 tag 版本（404），publish 发的是 package.json 版本（可能是旧的），
          # 后面「取 tarball」又按 tag 版本去 registry 拉 → 整条链会错在最难查的地方。
          PKG_V=$(node -p "require('./package.json').version")
          if [ "$PKG_V" != "$VERSION" ]; then
            echo "::error::tag $TAG 要求发布 $VERSION，但 package.json 是 $PKG_V —— npm publish 会发错版本"
            exit 1
          fi
          echo "tag $TAG 与 package.json 版本一致：$VERSION"

      - name: 安装宿主契约检查依赖
        run: npm install --no-audit --no-fund

      - name: 严格宿主契约与插件回归门
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "发布 tag=$RELEASE_TAG sha=$(git rev-parse HEAD)"
          npm run contract
          npm run check
          npm run report

      - name: 发布到 npm（Trusted Publishing：OIDC，无 token、无 OTP）
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PKG/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "registry 上已有 $VERSION —— 跳过 publish（幂等：重跑本 workflow 只会补 Release）"
            exit 0
          fi
          echo "::group::npm publish"
          # --provenance 需要 id-token: write（上面已授权）；--access public 是新包必填
          npm publish --provenance --access public
          echo "::endgroup::"

      - name: 等 registry 放出该版本（暂存审核期间会一直 404，最多 10 分钟）
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PKG/$VERSION")
            if [ "$CODE" = "200" ]; then
              echo "registry 上已可下载 $VERSION"
              exit 0
            fi
            echo "第 $((i*15)) 秒：registry 还没放出 $VERSION（可能仍在审核）…"
            sleep 15
          done
          echo "::error::10 分钟内 registry 还没放出 $VERSION（仍在审核？稍后重跑本 workflow 会补 Release）"
          exit 1

      - name: 校验 tarball 完整性并建 GitHub Release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          TARBALL="$PKG-$VERSION.tgz"

          # 资产必须是 registry 上的**官方** tarball，且 sha1 与 registry 的 dist.shasum 逐字节一致
          # （仓库纪律：资产核 sha1==dist.shasum）。
          curl -sL -o "$TARBALL" "https://registry.npmjs.org/$PKG/-/$TARBALL"
          EXPECTED=$(curl -s "https://registry.npmjs.org/$PKG/$VERSION" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).dist.shasum)})")
          ACTUAL=$(sha1sum "$TARBALL" | cut -d' ' -f1)
          echo "registry dist.shasum: $EXPECTED"
          echo "本地 tarball sha1 : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::tarball 与 registry 不一致，拒绝发布 Release"
            exit 1
          fi

          # Release notes 取 CHANGELOG 里对应版本的那一节；取不到就退回一句最小说明（不因此中断发版）
          node tools/release-notes.mjs "$VERSION" > release-notes.md
          test -s release-notes.md || echo "## $VERSION" > release-notes.md

          # 仅 registry 当前 stable latest 可以晋升；历史补包不改变已有 Release 的标记。
          registry_latest=$(npm view "$PKG" dist-tags.latest --registry=https://registry.npmjs.org)
          test -n "$registry_latest"
          latest=false
          if [[ "$VERSION" == "$registry_latest" && "$VERSION" != *-* ]]; then latest=true; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" --clobber
            args=(--notes-file release-notes.md)
            if [[ "$latest" == true ]]; then args+=(--latest); fi
            gh release edit "$TAG" "${args[@]}"
          else
            gh release create "$TAG" "$TARBALL" --verify-tag --notes-file release-notes.md --title "$TAG — dsh-theme-palette" --latest="$latest"
          fi
          echo "Release 已就绪：$TAG"

      - name: 收尾核对
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const j=JSON.parse(s);
              const v=process.env.VERSION;
              console.log('registry 版本号 :', j.versions[v] ? j.versions[v].version : '（缺失！）');
              console.log('dist-tags.latest:', j['dist-tags'].latest);
              console.log('attestations    :', j.versions[v] && j.versions[v].dist.attestations ? '有（provenance 生效）' : '无');
            });
          " < <(curl -s "https://registry.npmjs.org/$PKG")
